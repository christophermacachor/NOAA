name = "noaa-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-10"

# Custom domain already configured in Cloudflare dashboard
routes = [
  { pattern = "noaa.macachor.org", custom_domain = true }
]

# Static assets served from ./public (index.html, etc.)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

